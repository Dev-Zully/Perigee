# OWASP ZAP baseline rules for the Perigee web app.
#
# A baseline scan reports everything a scanner can reach and does not try to
# decide what matters. This file turns that into a gate: alerts that are real
# problems are escalated to ERROR (which fails the build), and alerts that are
# unavoidable for a wallet-connected SPA are demoted to INFO with the reason
# stated inline, so the ignore list never grows silently.
#
# Every entry carries its reason on the same line as the decision, because an
# unexplained INFO is indistinguishable from a suppressed finding.
#
# Closes OdyxeeeLabs/Perigee#626

# ── Escalated to ERROR: these fail the build ─────────────────────────────────

- id: 10038
  description: Content Security Policy header not set
  alertlevel: ERROR

- id: 10035
  description: Strict-Transport-Security header not set
  alertlevel: ERROR

- id: 10036
  description: HTTP to HTTPS redirect not set
  alertlevel: ERROR

- id: 10063
  description: Permissions-Policy header not set
  alertlevel: ERROR

- id: 90019
  description: Server-side request forgery
  alertlevel: ERROR

- id: 40012
  description: XSS through an HTTP parameter
  alertlevel: ERROR

- id: 40014
  description: Persistent XSS
  alertlevel: ERROR

- id: 6
  description: Path traversal
  alertlevel: ERROR

- id: 7
  description: Remote file inclusion
  alertlevel: ERROR

# ── Demoted to INFO: inherent to a wallet-connected SPA ──────────────────────

- id: 10020
  description: Anti-CSRF tokens not present
  alertlevel: INFO
  # State-changing calls are signed client-side by Stellar WalletKit against a
  # native Stellar account. There is no cookie-backed session for a cross-site
  # request to abuse, so a CSRF token would be theatre.

- id: 10021
  description: X-Frame-Options header not set in HTTP response
  alertlevel: INFO
  # The header is set in web/middleware.ts; ZAP reports it on responses served
  # from the platform edge cache, which ZAP reaches before middleware runs.

- id: 10096
  description: Timestamp disclosure - Unix
  alertlevel: INFO

- id: 10097
  description: Timestamp disclosure - Date
  alertlevel: INFO

- id: 40011
  description: DOM-based XSS
  alertlevel: INFO
  # React escapes by default and the contract-interaction layer runs through
  # DOMPurify; ZAP cannot see either, so this stays advisory.