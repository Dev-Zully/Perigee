# Transport security policy for Perigee.
#
# Asserted by scripts/security/verify_tls_config.py. Declaring a setting here is
# what makes it enforceable; a control that only exists in a runbook is a control
# nobody checks.
version: 1

external:
  min_version: "1.3"
  # TLS 1.2 is deliberately absent. See docs/TLS.md for the compatibility
  # argument — the cost is borne by clients we control.
  max_version: "1.3"

  # TLS 1.3 fixes its own suite list, which is the point of the version.
  suites_1_3:
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256

  # Forward-secret AEAD only if a client ever forces 1.2. No CBC, no RSA key
  # exchange, no compression.
  suites_1_2_fallback:
    - ECDHE-ECDSA-AES128-GCM-SHA256
    - ECDHE-RSA-AES128-GCM-SHA256
    - ECDHE-ECDSA-AES256-GCM-SHA384
    - ECDHE-RSA-AES256-GCM-SHA384

  send_fallback_scsv: true

  certificate_authority: lets-encrypt
  issuer: cert-manager
  renewal_window_days: 30

internal:
  mtls: true
  mesh: linkerd
  identity: spire
  # SVIDs are short-lived so an exfiltrated certificate expires on its own.
  svid_ttl_hours: 1
  enforce_on:
    - core
    - web
    - indexer

hsts:
  max_age: 31536000
  include_subdomains: true
  preload: true
  # Submission to the browser preload list is an operational step and is
  # irreversible for the already-preloaded population, so it is gated on this.
  preload_requires_all_subdomains_live: true

monitoring:
  # Alerts fire at these remaining-lifetimes. 30 days equals the renewal window,
  # so firing there means renewal is not happening now, not that there is an
  # emergency.
  expiry_alert_days: [30, 14, 7, 1]
  # Synthetic probe from outside the cluster: an alert generated by the same
  # system that manages the certificates cannot report that system being down.
  synthetic_probe_interval_minutes: 5

external_domains:
  - host: perigee.example
    certificate: perigee.example
    monitor: true
  - host: app.perigee.example
    certificate: perigee.example
    monitor: true
  - host: api.perigee.example
    certificate: api.perigee.example
    monitor: true