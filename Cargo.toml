[workspace]
resolver = "2"
members = [
    "core",
    "contracts/bootstrap",
    "contracts/error_codes",
    "contracts/math",
    "contracts/guards",
    "contracts/governance",
    "contracts/staking_rewards",
    "contracts/oracle_aggregator",
    "contracts/policy_vault",
    # Deterministic vault factory + UUPS proxy (#632, #635).
    "contracts/vault_factory",
    # Pluggable yield strategies, rotation, performance fees (#633).
    "contracts/vault_strategy",
    # Circuit breaker, partial pause, timelocked unpause (#634).
    "contracts/vault_guard",
]

# CONTRACT-41 (#535): dedicated build profile used by `scripts/coverage.sh`
# and the "Contracts — coverage" workflow. It inherits `dev` so tests behave
# exactly as they do locally, pins line-table debug info so coverage maps back
# to source lines, and disables incremental compilation so repeated runs
# produce identical numbers.
[profile.coverage]
inherits = "dev"
debug = 1
incremental = false
