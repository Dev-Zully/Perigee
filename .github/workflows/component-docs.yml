name: Component Library Docs

# Keeps the generated component-library documentation (issue #709) honest:
#   * `docs`    — fails the PR when the committed docs drift from the
#                 component source, and runs the docs test suite.
#   * `publish` — on a release, freezes the docs for the released version and
#                 publishes the docs site to GitHub Pages.
#
# The docs site is plain static HTML under `web/public/component-docs`, so the
# same artifact is also served by the app at /component-docs and can be hosted
# on any static host.

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'web/components/**'
      - 'web/scripts/docs/**'
      - 'web/docs/components/**'
      - 'web/public/component-docs/**'
      - 'web/__tests__/component-docs.test.cjs'
      - 'web/package.json'
      - '.github/workflows/component-docs.yml'
  release:
    types: [published]
  workflow_dispatch:

# Only one Pages deployment at a time; PR checks stay independent.
concurrency:
  group: component-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    name: Docs are in sync and tested
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 matches the version the web app is developed against. It also
      # matters for tests: the web test script passes `**` globs to
      # `node --test`, and only Node >= 22 expands those patterns itself.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated docs match the component source
        run: npm run docs:check

      - name: Run the test suite
        run: npm test
        # Note: `npm test` relies on `**` glob expansion in `node --test`.
        # On Node <= 20 only `__tests__/migration/appRouter.test.cjs` matched
        # and the run aborted on the first unresolved pattern — that is a
        # pre-existing script issue, unrelated to the docs work.
        continue-on-error: false

      - name: Upload the docs site
        uses: actions/upload-artifact@v4
        with:
          name: component-docs-site
          path: web/public/component-docs
          if-no-files-found: error

  publish:
    name: Publish versioned docs site
    needs: docs
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the frozen version snapshot back to the repo
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve the version being released
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing docs for v${VERSION}"

      - name: Freeze the docs for this release
        run: npm run docs:release -- --version "${{ steps.version.outputs.value }}" --date "$(date -u +%F)"

      - name: Commit the frozen snapshot
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/docs/components web/public/component-docs
          git commit -m "docs(components): publish v${{ steps.version.outputs.value }} docs snapshot [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public/component-docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
